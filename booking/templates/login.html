{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Table Booking</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #ffffffcc;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-link {
            font-weight: 500;
        }

        .login-container {
            margin-top: auto;
            margin-bottom: auto;
            padding: 2rem;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            color: #fff;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: #fff;
        }

        .form-control {
            border-radius: 10px;
            border: none;
        }

        .form-control:focus {
            box-shadow: 0 0 10px rgba(89, 0, 255, 0.4);
            border: 1px solid #5a00ff;
        }

        .btn-login {
            background-color: #ffffff;
            color: #6e00ff;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #6e00ff;
            color: white;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: auto;
            padding: 1rem 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<!-- ✅ White Glassy Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="{% url 'home' %}">
            <i class="bi bi-house-heart-fill me-1"></i> TableBooking
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
            <ul class="navbar-nav">
                <li class="nav-item mx-2">
                    <a class="nav-link text-dark" href="{% url 'home' %}">
                        <i class="bi bi-house-door-fill"></i> Home
                    </a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link text-dark" href="{% url 'login' %}">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link text-dark" href="{% url 'register' %}">
                        <i class="bi bi-person-plus-fill"></i> Register
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ✅ Glassmorphism Login Card -->
<div class="container d-flex flex-grow-1 align-items-center justify-content-center">
    <div class="login-container">
        <h2><i class="bi bi-person-circle me-2"></i>Login</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </div>
        </form>
    </div>
</div>

<footer>
    <small>&copy; 2025 TableBooking System. All rights reserved.</small>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
