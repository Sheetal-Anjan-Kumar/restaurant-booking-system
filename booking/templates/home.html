<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome | Restaurant Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .bg-image {
      background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1050&q=80') no-repeat center center/cover;
      height: 100%;
      width: 100%;
      position: absolute;
      z-index: -2;
    }

    .overlay-blur {
      backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.25);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 60px 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 550px;
    }

    .overlay-blur h1 {
      font-size: 2.8rem;
      font-weight: bold;
      color: white;
      margin-bottom: 20px;
    }

    .overlay-blur p {
      font-size: 1.2rem;
      color: #2d3436;
      margin-bottom: 30px;
    }

    .btn-custom {
      background-color: #fbc531;
      color: #2d3436;
      font-size: 1.1rem;
      padding: 12px 28px;
      margin: 10px 5px;
      border: none;
      border-radius: 8px;
      transition: 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-custom:hover {
      background-color:  #2d3436;
      color: #fbc531;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 0.9rem;
      text-shadow: 0 0 5px black;
    }
  </style>
</head>
<body>

<div class="bg-image"></div>

<div class="overlay-blur">
  <h1>Welcome to Restaurant Booking</h1>
  <p>Book your favorite table at top restaurants</p>
  <a href="{% url 'login' %}" class="btn-custom">Login</a>
  <a href="{% url 'register' %}" class="btn-custom">Register</a>
  <a href="{% url 'admin_panel' %}" class="btn-custom">Admin Panel</a>

</div>

<footer>&copy; 2025 Restaurant Booking System</footer>

</body>
</html>
