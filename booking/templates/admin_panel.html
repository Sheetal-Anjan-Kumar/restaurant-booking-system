{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #2980b9, #6dd5fa);
            min-height: 100vh;
            padding-top: 70px;
        }

        .navbar-custom {
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .navbar-custom .nav-link, .navbar-brand {
            color: #2c3e50 !important;
            font-weight: 600;
        }

        .panel-container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .panel-container h2 {
            text-align: center;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .admin-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-links a {
            display: block;
            padding: 15px;
            background-color: #3498db;
            color: white;
            text-align: center;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .admin-links a:hover {
            background-color: #2c80b4;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">TableBooking</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Admin Panel -->
<div class="panel-container mt-5">
    <h2>Admin Control Panel</h2>
    <div class="admin-links">
        <a href="{% url 'admin_booking_report' %}">📅 View Booking Reports (Daily/Weekly)</a>
        <a href="{% url 'export_excel' %}">📊 Export Bookings to Excel</a>
        <a href="{% url 'export_pdf' %}">📄 Export Bookings to PDF</a>
        <a href="{% url 'manage_tables' %}">🪑 Manage Tables (Add/Edit/Delete)</a>
    </div>
</div>

</body>
</html>
