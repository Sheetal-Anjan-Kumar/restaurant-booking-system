<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #0d6efd;
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white !important;
        }
    </style>
</head>
<body>
    <!-- ✅ Custom Blue Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Table Booking</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">🏠 Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'admin_panel' %}">📊 Admin Panel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">🚪 Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ✅ Edit Table Form -->
    <div class="container mt-5">
        <h3>✏ Edit Table</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Restaurant:</label>
                <select class="form-select" name="restaurant" required>
                    {% for restaurant in restaurants %}
                        <option value="{{ restaurant.id }}" {% if restaurant.id == table.restaurant.id %}selected{% endif %}>
                            {{ restaurant.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Table Number:</label>
                <input type="text" class="form-control" name="table_number" value="{{ table.table_number }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Capacity:</label>
                <input type="number" class="form-control" name="seats" value="{{ table.seats }}" required>
            </div>
            <button type="submit" class="btn btn-primary">✅ Update Table</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
